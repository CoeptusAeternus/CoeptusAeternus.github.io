<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Funny Placeholder</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    .pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, #00ffd5 2px, transparent 2px);
      background-size: 40px 40px;
      transition: background-position 0.1s;
    }

    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      text-align: center;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 2px;
      pointer-events: none;
      transition: transform 0.3s, opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="pattern" id="pattern"></div>
  <div class="title">Under Construction<br>Move your mouse for chaos</div>

  <script>
    const pattern = document.getElementById('pattern');

    document.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;

      // Move background pattern slightly
      pattern.style.backgroundPosition = `${x * 0.05}px ${y * 0.05}px`;

      // Create particle
      const particle = document.createElement('div');
      particle.className = 'particle';

      // Random color
      const colors = ['#ff4d4d', '#4dff88', '#4da6ff', '#ffd24d'];
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];

      particle.style.left = x + 'px';
      particle.style.top = y + 'px';

      document.body.appendChild(particle);

      // Animate
      setTimeout(() => {
        particle.style.transform = `translate(${Math.random()*120-60}px, ${Math.random()*120-60}px) rotate(${Math.random()*360}deg) scale(1.5)`;
        particle.style.opacity = 0;
      }, 10);

      setTimeout(() => {
        particle.remove();
      }, 400);
    });
  </script>
</body>
</html>
